spring:
  application:
    name: banalna-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banalna}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

cors:
  allowed-origin: ${FRONTEND_URL:http://localhost:5173}
